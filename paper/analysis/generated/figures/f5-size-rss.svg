<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;fill:#161616}.title{font-size:24px;font-weight:700}.label{font-size:15px}.small{font-size:12px;fill:#555}.axis{stroke:#777;stroke-width:1}.grid{stroke:#ddd;stroke-width:1}.w8{fill:#d94a42}.int4{fill:#315b9a}.w8point{fill:#fff;stroke:#8f211b;stroke-width:2}.int4point{fill:#fff;stroke:#173b73;stroke-width:2}</style>
<text x="40" y="48" class="title">Storage and peak process memory</text>
<text x="40" y="75" class="small">MiB; RSS is process resident memory, not total system RAM</text>
