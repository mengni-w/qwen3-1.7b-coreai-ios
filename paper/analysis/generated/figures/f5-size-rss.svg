<rect x="177" y="248.56" width="76" height="171.44" class="w8"/>
<text x="215" y="240.56" text-anchor="middle" class="small">1,714.4</text>
<rect x="287" y="327.54" width="76" height="92.46" class="int4"/>
<text x="325" y="319.54" text-anchor="middle" class="small">924.6</text>
<text x="270" y="448" text-anchor="middle" class="label">Compiled bundle</text>
<rect x="557" y="133.50" width="76" height="286.50" class="w8"/>
<text x="595" y="125.50" text-anchor="middle" class="small">2,865.0</text>
<rect x="667" y="220.47" width="76" height="199.53" class="int4"/>
<text x="705" y="212.47" text-anchor="middle" class="small">1,995.3</text>
<text x="650" y="448" text-anchor="middle" class="label">Peak process RSS</text>
<rect x="650" y="45" width="14" height="14" class="w8"/><text x="672" y="57" class="small">Static-W8</text>
<rect x="760" y="45" width="14" height="14" class="int4"/><text x="782" y="57" class="small">Dynamic-INT4</text>
</svg>
